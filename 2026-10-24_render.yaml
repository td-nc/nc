# Deploy su Render: New > Blueprint > collega il repository tdintegration/td-nc.
# Stessa impostazione di td-integration / td-cash: app sempre accesa, database persistente con backup.
services:
  - type: web
    name: td-nc
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: BASE_URL
        sync: false   # https://nc.toscanadiagnostica.it in produzione (https://td-nc.onrender.com prima del dominio). Impostato nel pannello, non viene sovrascritto dai sync del Blueprint
      - key: DATABASE_URL
        fromDatabase:
          name: td-nc-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_HOURS
        value: "10"
      - key: SEED_ADMIN_EMAIL
        value: francesco.epifani@toscanadiagnostica.it
      - key: SEED_ADMIN_NAME
        value: Francesco Epifani
      - key: SEED_ADMIN_PASSWORD
        sync: false   # facoltativa (min 12 caratteri): password locale di emergenza per il primo amministratore
      - key: SEED_DEMO
        value: "false"   # true solo su un'istanza di collaudo: crea 4 sedi e 12 accettazioni fittizie
      - key: AUTO_LAB_DOMAINS
        value: toscanadiagnostica.it   # domini Microsoft 365 abilitati in automatico come Laboratorio
      - key: ENTRA_CLIENT_ID
        sync: false   # App registration (vedi README)
      - key: ENTRA_CLIENT_SECRET
        sync: false
      - key: ENTRA_AUTHORITY
        sync: false   # tenant id di Toscana Diagnostica (single tenant) oppure "organizations"
      # StudioLAB ServiceNET (CB Sistemi)
      - key: LIS_BASE_URL
        value: https://servicenet.toscanadiagnostica.it   # nodo ServiceNET di produzione (demo CB: https://servicenet.studiolab.it)
      - key: LIS_API_KEY
        sync: false      # chiave rilasciata da CB Sistemi: inserirla nel dashboard Render, mai nel repository
      - key: LIS_CODICE_CLIENTE
        value: TD        # CodiceCliente da valorizzare nelle chiamate (indicazione CB Sistemi)
      - key: LIS_WRITE_BACK
        value: "false"   # true per bloccare/sbloccare esami, allegare il rapporto NC e aprire la segnalazione su StudioLAB
      - key: LIS_SEGNALAZIONI
        value: "true"    # con write-back attivo: ogni NC apre una segnalazione (Prest_Messaggi) sull'accettazione in StudioLAB
      - key: LIS_TIPO_SEGNALAZIONE
        value: "0"       # TipoSegnalazione (0-9): significato da confermare con CB Sistemi
      - key: LIS_PUSH_SECRET
        generateValue: true   # da comunicare a CB Sistemi per /api/lis/push e /api/hl7 (header X-Push-Secret)
      # Email in uscita da laboratorio@toscanadiagnostica.it
      - key: MAIL_PROVIDER
        sync: false   # graph in produzione (smtp | log = nessun invio reale, solo registro). Impostato nel pannello, non viene sovrascritto dai sync del Blueprint
      - key: MAIL_FROM
        value: laboratorio@toscanadiagnostica.it
      - key: MAIL_FROM_NAME
        value: Laboratorio Toscana Diagnostica
      - key: MAIL_LAB_NOTIFY
        value: laboratorio@toscanadiagnostica.it
      - key: GRAPH_TENANT_ID
        sync: false
      - key: GRAPH_CLIENT_ID
        sync: false
      - key: GRAPH_CLIENT_SECRET
        sync: false
      - key: SCHEDULER_MINUTES
        value: "5"
databases:
  - name: td-nc-db
    plan: basic-256mb
    region: frankfurt
    databaseName: tdnc
    user: tdnc
